<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Aura — 음성 AI</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,100..400&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500&family=Space+Mono&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="typography.css" />
  <link rel="stylesheet" href="polaroid.css" />
  <link rel="stylesheet" href="pol-ui.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="pol-body" data-phase="idle" data-running="false">
  <canvas id="stage" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <a class="pol-back-btn aura-back" href="https://cityzen.kr">&#8592; cityzen</a>
  <p class="aura-mark" aria-hidden="true">Aura</p>

  <main id="ui">
    <p id="caption" class="caption" role="status" aria-live="polite">오브를 누르고 말을 걸어보세요</p>

    <div class="dock">
      <button id="orb" class="orb" aria-label="대화 시작 / 정지" aria-pressed="false">
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="ring r3"></span>
        <span class="orb-core"></span>
        <svg class="mic" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.6"/>
          <path d="M6 11a6 6 0 0 0 12 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12 17v4M9 21h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <p id="status" class="status" aria-live="polite">시작을 누르세요</p>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
