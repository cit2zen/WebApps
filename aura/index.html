<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura — 음성 AI</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300..600&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="/cityzen-ui.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet" />
  <style>
    /* cityzen 공통 헤더: 앱이 fixed로 화면을 꽉 채우므로 헤더만 상단에 띄움 (앱 레이아웃·캔버스 미변경) */
    .cz-gamehead { position: fixed; top: 0; left: 0; right: 0; z-index: 30; background: linear-gradient(90deg, rgba(94,242,255,.05), rgba(2,3,10,.55)); backdrop-filter: blur(6px); }
    /* Polaroid dock overrides */
    .dock { font-family: 'Fraunces', serif; font-style: italic; }
    .orb { border-color: rgba(192,160,96,.55); box-shadow: 0 0 18px rgba(192,160,96,.25); }
    .orb:hover { box-shadow: 0 0 30px rgba(192,160,96,.4); }
    .orb-core { background: radial-gradient(circle, rgba(192,160,96,.18), transparent 70%); }
    #status { color: #c0a060; }
    #status::before { background: #c0a060; box-shadow: 0 0 10px #c0a060; }
  </style>
</head>
<body data-phase="idle" data-running="false">
  <canvas id="stage"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main id="ui">
    <p id="caption" class="caption" role="status" aria-live="polite">오브를 누르고 말을 걸어보세요</p>

    <div class="dock">
      <button id="orb" class="orb" aria-label="대화 시작 / 정지" aria-pressed="false">
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="ring r3"></span>
        <span class="orb-core"></span>
        <svg class="mic" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.6"/>
          <path d="M6 11a6 6 0 0 0 12 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12 17v4M9 21h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <p id="status" class="status" aria-live="polite">시작을 누르세요</p>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
  <script type="module">
    import { czHeader } from '/cityzen-ui.js';
    czHeader({ title: 'Aura' });
  </script>
  <a class="pol-back-btn" href="https://portfolio.cityzen.kr">&#8592; cityzen</a>
</body>
</html>
