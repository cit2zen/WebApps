<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura — 음성 AI</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300..600&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-phase="idle" data-running="false">
  <canvas id="stage"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="wordmark">Aura</header>

  <main id="ui">
    <p id="caption" class="caption"></p>

    <div class="dock">
      <button id="orb" class="orb" aria-label="대화 시작 / 정지">
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="ring r3"></span>
        <span class="orb-core"></span>
        <svg class="mic" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.6"/>
          <path d="M6 11a6 6 0 0 0 12 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12 17v4M9 21h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <p id="status" class="status">키를 설정하고 시작을 누르세요</p>
    </div>
  </main>

  <button id="gear" class="gear" aria-label="설정">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4 5.3 5.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <dialog id="settings">
    <form method="dialog" class="settings-form">
      <h2>설정</h2>
      <label>Anthropic API 키
        <input id="apikey" type="password" placeholder="sk-ant-..." autocomplete="off" />
      </label>
      <p class="hint">키는 이 브라우저(localStorage)에만 저장됩니다. 서버로 전송되지 않습니다.</p>
      <menu>
        <button value="cancel" class="ghost">취소</button>
        <button id="save-key" value="default" class="primary">저장</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
