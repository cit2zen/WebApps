<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Polaroid Editorial 토큰 미러(design-tokens.css): bg-base #ece7dc · gold-glow #e8c878 · gold-mid #c0a060 · gold-dark #9a7840 · ink-mid #4a3820 -->
  <defs>
