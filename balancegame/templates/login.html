{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <h1>⚖ 밸런스 게임</h1>
    <p class="question">위~대하신 대초원의 탄신일은 무엇일까요?</p>
    <form method="POST" action="/login">
      <input type="text" name="answer" placeholder="답 입력..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="numeric" enterkeyhint="go" autofocus>
      {% if error %}
      <p class="error-msg" style="margin-top:0.5rem">{{ error }}</p>
      {% endif %}
      <button class="btn" type="submit" style="margin-top:1rem">입장하기</button>
    </form>
  </div>
</div>
{% endblock %}
