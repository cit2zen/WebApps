{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block body %}
<main class="login-wrap">
  <div class="login-card pol-tile">
    <h1 class="login-title">⚖ 밸런스 게임</h1>
    <p class="login-note">온보이싱 회원 전용 비공개 게임이에요.</p>
    <p class="login-question">위~대하신 대초원의 탄신일은 무엇일까요?</p>
    <p class="login-note">힌트: 생년월일 6자리 숫자</p>
    <form method="POST" action="/login" class="login-form">
      <input class="pol-input" type="text" name="answer" placeholder="답 입력..." aria-label="답" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="numeric" enterkeyhint="go" autofocus>
      {% if error %}
      <p class="pol-alert" role="alert">{{ error }}</p>
      {% endif %}
      <button class="pol-btn-primary pol-btn-lg" type="submit">입장하기</button>
    </form>
  </div>
</main>
{% endblock %}
