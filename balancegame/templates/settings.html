{% extends "base.html" %}
{% block title %}설정{% endblock %}
{% block body %}
<div class="settings-wrap">
  <div style="display:flex;justify-content:space-between;align-items:baseline">
    <h1 class="settings-title">⚙ 항목 관리</h1>
    <a href="/logout" class="nav-link">로그아웃</a>
  </div>

  <div class="upload-form">
    <label>이름 (필수)</label>
    <input type="text" id="inp-title" placeholder="예: 피자">

    <label>사진 (선택, jpg/png/webp, 최대 5MB)</label>
    <div class="drop-zone" id="drop-zone">
      <img class="drop-preview" id="drop-preview">
      <span id="drop-hint">여기에 이미지를 끌어다 놓거나 클릭하세요</span>
      <input type="file" id="inp-file" accept="image/jpeg,image/png,image/webp">
    </div>

    <button class="btn" id="btn-add">추가하기</button>
    <p class="status-msg" id="status"></p>
  </div>

  <div id="items-grid" class="items-grid"></div>

  <hr style="border:none;border-top:1px solid var(--cream-400)">

  <div style="display:flex;justify-content:space-between;align-items:baseline">
    <h1 class="settings-title">🗂 셋 관리</h1>
  </div>
  <div class="upload-form" id="set-form">
    <label>질문</label>
    <input type="text" id="inp-question" placeholder="이 중에 가장 좋은 것은?">
    <label>항목 선택 (2개 이상)</label>
    <div id="item-checkboxes" class="item-checkboxes"></div>
    <button class="btn" id="btn-save-set">셋 만들기</button>
    <p class="status-msg" id="set-status"></p>
  </div>
  <div id="sets-list"></div>
</div>
<script src="/static/settings.js"></script>
<script src="/static/sets.js"></script>
{% endblock %}
