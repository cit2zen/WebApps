{% extends "base.html" %}
{% block title %}셋 선택{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/lobby.css?v=1">{% endblock %}
{% block appbar_end %}<a href="{{ cross_url }}" class="pol-btn-ghost pol-btn-sm appbar-link">{{ cross_label }}</a>
<a href="/logout" class="pol-btn-ghost pol-btn-sm appbar-link">로그아웃</a>{% endblock %}
{% block body %}
<main class="lobby-wrap">
  <header class="page-head">
    <h1 class="page-title">⚖ 밸런스 게임</h1>
    <p class="page-sub">플레이할 셋을 선택하세요</p>
  </header>
  <div id="sets-grid" class="lobby-groups"></div>
  <p id="no-sets" class="empty-msg" style="display:none">
    셋이 없습니다. 설정 페이지에서 만들어주세요.
  </p>
</main>

<div id="size-overlay" class="pol-overlay size-overlay" style="display:none">
  <div class="pol-dialog size-modal" role="dialog" aria-modal="true" aria-labelledby="size-q">
    <p id="size-q" class="size-modal-q"></p>
    <p class="size-modal-label">몇 강으로 플레이할까요?</p>
    <div id="size-btns" class="size-btns"></div>
    <button type="button" class="pol-btn-ghost size-cancel" id="size-cancel">취소</button>
  </div>
</div>

<script src="/static/utils.js?v=1"></script>
<script>
const SIZES = [2, 4, 8, 16, 32];
let selectedSet = null;

function openSizePicker(s) {
  selectedSet = s;
  document.getElementById('size-q').textContent = '"' + s.question + '"';

  const available = SIZES.filter(size => s.item_count >= size);
  const container = document.getElementById('size-btns');
  container.innerHTML = '';

  if (!available.length) {
    container.innerHTML = `<p class="size-unavail">항목을 2개 이상 추가해야 플레이할 수 있어요.</p>`;
  } else {
    available.forEach(size => {
      const btn = document.createElement('button');
      btn.className = 'size-btn';
      btn.innerHTML = `
        <div class="size-photo"><span class="size-num">${size}</span></div>
        <span class="size-label-text">강</span>
      `;
      btn.addEventListener('click', () => {
        sessionStorage.setItem('selectedSetId', selectedSet.id);
        sessionStorage.setItem('bracketSize', size);
        location.href = '/game';
      });
      container.appendChild(btn);
    });
  }

  document.getElementById('size-overlay').style.display = 'flex';
}

document.getElementById('size-cancel').addEventListener('click', () => {
  document.getElementById('size-overlay').style.display = 'none';
  selectedSet = null;
});

document.getElementById('size-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) {
    document.getElementById('size-overlay').style.display = 'none';
    selectedSet = null;
  }
});

async function loadSets() {
  const res = await fetch('/api/sets');
  const sets = await res.json();
  const grid = document.getElementById('sets-grid');
  if (!sets.length) {
    document.getElementById('no-sets').style.display = 'block';
    return;
  }
  // 커버 변별력: 첫 항목 이미지가 있으면 썸네일, 없으면 첫 2글자 + 셋별 배경색 변주(.cover-0~5, style.css 토큰)
  const COVER_COUNT = 6;
  sets.forEach(s => {
    const group = document.createElement('div');
    group.className = 'lset-group';
    group.setAttribute('role', 'button');
    group.tabIndex = 0;
    group.setAttribute('aria-label', s.question);

    for (let i = 0; i < 2; i++) {
      const card = document.createElement('div');
      card.className = 'lset-card';
      card.innerHTML = `<div class="lset-photo"><span class="lset-deco">⚖</span></div>`;
      group.appendChild(card);
    }

    const front = document.createElement('div');
    front.className = 'lset-card';
    const photo = s.cover_image
      ? `<div class="lset-photo"><img src="/uploads/${esc(s.cover_image)}" alt=""></div>`
      : `<div class="lset-photo cover-${s.id % COVER_COUNT}">
           <span class="lset-initial">${esc(s.question.trim().slice(0, 2))}</span>
         </div>`;
    front.innerHTML = `
      ${photo}
      <div class="lset-q">"${esc(s.question)}"</div>
      <div class="lset-meta">${s.item_count}개 항목</div>
    `;
    group.appendChild(front);
    group.addEventListener('click', () => openSizePicker(s));
    group.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); openSizePicker(s); }
    });
    grid.appendChild(group);
  });
}

loadSets();
</script>
{% endblock %}
