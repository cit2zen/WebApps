{% extends "base.html" %}
{% block title %}결과{% endblock %}
{% block body %}
<style>
  /* 메인 이동 버튼 — style.css 개편 완료 전까지 페이지 내장 */
  .home-link {
    display: inline-block;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.15rem;
    color: var(--bg-warm);
    background: var(--ink-warm);
    padding: 0.8rem 2.2rem;
    text-decoration: none;
    transition: background var(--pol-ease);
  }
  .home-link:hover { background: var(--gold-dark); }
</style>
<div class="result-wrap">
  <h1 class="game-title">🏆 최종 우승</h1>
  <div id="winner-card" class="pol-card winner-card"></div>
  <h2 style="font-style:italic;font-weight:200;color:var(--ink-mid)">이 셋 랭킹</h2>
  <table class="ranking-table">
    <thead>
      <tr>
        <th class="rank-num">#</th>
        <th>이름</th>
        <th style="text-align:right">우승 횟수</th>
      </tr>
    </thead>
    <tbody id="ranking-body"></tbody>
  </table>
  <div style="display:flex;gap:1.5rem;margin-top:1rem;align-items:center">
    <a href="/" class="home-link">메인 화면으로</a>
    <a href="/logout" class="nav-link">로그아웃</a>
  </div>
</div>
<script src="/static/utils.js?v=1"></script>
<script>
const winner = JSON.parse(sessionStorage.getItem('winner') || 'null');
if (winner) {
  const card = document.getElementById('winner-card');
  const img = imageUrl(winner.image_path);
  card.innerHTML = `
    <div class="pol-photo">
      ${img ? `<img src="${img}" alt="${esc(winner.title)}">` : `<div class="pol-placeholder">${esc(winner.title.charAt(0).toUpperCase())}</div>`}
    </div>
    <div class="pol-caption">${esc(winner.title)}</div>
  `;
}

const setId = sessionStorage.getItem('selectedSetId');
const url = setId ? `/api/rankings?set_id=${setId}` : '/api/rankings';
fetch(url).then(r => r.json()).then(items => {
  const tbody = document.getElementById('ranking-body');
  tbody.innerHTML = items.map((item, i) => `
    <tr>
      <td class="rank-num">${i + 1}</td>
      <td>${esc(item.title)}</td>
      <td style="text-align:right;color:var(--gold-mid)">${item.win_count}회</td>
    </tr>
  `).join('');
});
</script>
{% endblock %}
