<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}홈{% endblock %} — 밸런스 게임</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,200;0,300;1,100;1,200;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=9">
</head>
<body>
  {% block body %}{% endblock %}
  <script>
    // 뒤로가기 → onvoicing 허브 (설정 호스트 제외)
    (function () {
      if (location.hostname.indexOf('settings') !== -1) return;
      if (history.state && history.state.czHub) return;
      history.pushState({ czHub: 1 }, '');
      window.addEventListener('popstate', function (e) {
        if (!e.state || !e.state.czHub) location.replace('https://onvoicing.cityzen.kr/');
      });
    }());
  </script>
</body>
</html>
