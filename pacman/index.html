<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PAC-MAN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffe600'/%3E%3Cpath d='M16 16 L31 7 A15 15 0 0 1 31 25 Z' fill='%23000'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,100..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../design-tokens.css" />
  <link rel="stylesheet" href="../typography.css" />
  <link rel="stylesheet" href="../polaroid.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <button id="settings-btn" aria-label="설정">⚙</button>
    <header id="hud">
      <div class="hud-block">
        <span class="hud-label">SCORE · 점수</span>
        <span id="score" class="hud-value" aria-live="polite">0</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">HIGH · 최고</span>
        <span id="high" class="hud-value">0</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">LIVES · 목숨</span>
        <span id="lives" class="hud-value" aria-label="남은 목숨"></span>
      </div>
      <div class="hud-block">
        <span class="hud-label">LEVEL · 레벨</span>
        <span id="level" class="hud-value" aria-live="polite">1</span>
      </div>
    </header>

    <div id="stage">
      <canvas id="board" role="img" aria-label="팩맨 미로 게임 보드"></canvas>
      <!-- 인게임 상태 오버레이 (READY!/PAUSED) — 반투명, 미로·HUD가 비쳐 보임 -->
      <div id="overlay" class="overlay hidden">
        <p id="overlay-msg" class="overlay-msg" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <!-- 로비 오버레이 (타이틀/게임오버) — 불투명 풀스크린 폴라로이드 -->
  <div id="lobby" class="pol-lobby">
    <div class="pol-lcard">
      <div class="pol-lphoto" aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <rect class="lp-bg" width="100" height="100" />
          <g class="lp-wall" fill="none" stroke-width="3" stroke-linecap="round">
            <rect x="8" y="8" width="84" height="84" rx="6" />
            <path d="M24 26 H42 M58 26 H76" />
            <path d="M24 74 H42 M58 74 H76" />
            <path d="M50 8 V20 M50 80 V92" />
            <path d="M8 38 H18 M82 38 H92" />
            <path d="M8 62 H18 M82 62 H92" />
          </g>
          <g class="lp-dot">
            <circle cx="26" cy="17" r="1.8" /><circle cx="38" cy="17" r="1.8" />
            <circle cx="62" cy="17" r="1.8" /><circle cx="74" cy="17" r="1.8" />
            <circle cx="46" cy="50" r="2.2" /><circle cx="53" cy="50" r="2.2" />
            <circle cx="26" cy="83" r="1.8" /><circle cx="38" cy="83" r="1.8" />
            <circle cx="62" cy="83" r="1.8" /><circle cx="74" cy="83" r="1.8" />
          </g>
          <path class="lp-pac" d="M30 50 L37.8 45.5 A9 9 0 1 0 37.8 54.5 Z" />
          <path class="lp-ghost" d="M61 59 V49 A9 9 0 0 1 79 49 V59 L76 56 L73 59 L70 56 L67 59 L64 56 Z" />
          <circle class="lp-eye" cx="66.5" cy="47.5" r="2.2" />
          <circle class="lp-eye" cx="73.5" cy="47.5" r="2.2" />
        </svg>
      </div>
      <span class="pol-lnum">cityzen</span>
      <span class="pol-ltag">pac-man</span>
    </div>
    <h2 id="lobby-title" class="pol-ltitle">pac-man</h2>
    <p id="lobby-desc" class="pol-ldesc">먹어라, 도망쳐라.</p>
    <button id="start-btn" class="pol-lbtn" type="button">클릭하여 시작</button>
    <span class="pol-llabel">cityzen &middot; Game - Arcade</span>
  </div>

  <div id="settings" class="settings hidden">
    <div class="settings-card">
      <h2>설정</h2>
      <label class="slider-row">
        <span>배경음</span>
        <input id="bgm-vol" type="range" min="0" max="1" step="0.01" />
        <output id="bgm-out">35%</output>
      </label>
      <label class="slider-row">
        <span>효과음</span>
        <input id="sfx-vol" type="range" min="0" max="1" step="0.01" />
        <output id="sfx-out">60%</output>
      </label>
      <button id="settings-close">닫기</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
  <a class="pol-back-btn" href="https://games.cityzen.kr">&#8592; 게임 허브</a>
</body>
</html>
