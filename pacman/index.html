<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NEON PAC-MAN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffe600'/%3E%3Cpath d='M16 16 L31 7 A15 15 0 0 1 31 25 Z' fill='%23000'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,100;1,200;1,300&family=Space+Mono&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../cityzen-ui.css" />
  <style>
    /* cityzen 공통 헤더가 가려지지 않도록 최소 레이아웃 보정 (게임 로직/캔버스 무관) */
    body:has(> .cz-gamehead) {
      flex-direction: column;
      justify-content: flex-start;
      overflow-y: auto;
    }
    body:has(> .cz-gamehead) #game-wrap {
      flex: 1 0 auto;
      justify-content: center;
    }
    .cz-gamehead { width: 100%; flex: 0 0 auto; }
  </style>
</head>
<body>
  <div id="game-wrap">
    <button id="settings-btn" aria-label="설정">⚙</button>
    <header id="hud">
      <div class="hud-block">
        <span class="hud-label">SCORE · 점수</span>
        <span id="score" class="hud-value" aria-live="polite">0</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">HIGH · 최고</span>
        <span id="high" class="hud-value">0</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">LIVES · 목숨</span>
        <span id="lives" class="hud-value" aria-label="남은 목숨"></span>
      </div>
      <div class="hud-block">
        <span class="hud-label">LEVEL · 레벨</span>
        <span id="level" class="hud-value" aria-live="polite">1</span>
      </div>
    </header>

    <div id="stage">
      <canvas id="board" role="img" aria-label="팩맨 미로 게임 보드"></canvas>
      <div id="overlay" class="overlay pol-lobby">
        <div class="pol-lcard">
          <div class="pol-lphoto" style="background:linear-gradient(145deg,#c8b040,#6a5a18)"></div>
          <span class="pol-lnum">cityzen</span>
          <span class="pol-ltag">pac-man</span>
        </div>
        <h2 class="pol-ltitle">pac-man</h2>
        <p class="pol-ldesc">먹어라, 도망쳐라.</p>
        <div class="pol-lbtn" style="cursor:pointer">클릭하여 시작</div>
        <span class="pol-llabel">cityzen &middot; Game - Arcade</span>
      </div>
    </div>
  </div>

  <div id="settings" class="settings hidden">
    <div class="settings-card">
      <h2>설정</h2>
      <label class="slider-row">
        <span>배경음</span>
        <input id="bgm-vol" type="range" min="0" max="1" step="0.01" />
        <output id="bgm-out">35%</output>
      </label>
      <label class="slider-row">
        <span>효과음</span>
        <input id="sfx-vol" type="range" min="0" max="1" step="0.01" />
        <output id="sfx-out">60%</output>
      </label>
      <button id="settings-close">닫기</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
  <script type="module">
    import { czHeader } from '../cityzen-ui.js';
    czHeader({ title: 'Neon Pac-Man' });
  </script>
</body>
</html>
