<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>야옹! — 목소리로 점프하는 고양이</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🐱</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="800" height="450"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="lives" aria-label="생명"></div>
      <div id="score">0 m</div>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay">
      <div class="panel">
        <h1>야옹!</h1>
        <p class="sub">목소리로 고양이를 점프시켜요 🐱</p>
        <p class="hint">크게 소리칠수록 높이 뛰어요.<br />선인장을 피해 멀리 달려보세요!</p>
        <button id="start-btn" class="btn primary">시작하기</button>
        <button id="settings-btn" class="btn ghost">⚙️ 설정</button>
        <p id="best-line" class="best"></p>
      </div>
    </div>

    <!-- 준비(대기) 화면 -->
    <div id="ready-screen" class="overlay hidden">
      <div class="panel">
        <h2>준비됐나요?</h2>
        <p class="hint">마이크에 대고 크게 <b>"야옹!"</b> 외치면 점프해요.<br />소리가 클수록 더 높이 뛰어요.</p>
        <div class="meter-wrap">
          <span class="meter-label">목소리 테스트</span>
          <div class="meter"><div id="ready-meter-fill"></div><div id="ready-meter-threshold"></div></div>
        </div>
        <p id="ready-mic-status" class="mic-status"></p>
        <button id="ready-start" class="btn primary">출발! 🐾</button>
        <button id="ready-settings" class="btn ghost">⚙️ 설정</button>
        <button id="ready-back" class="btn ghost">← 처음으로</button>
      </div>
    </div>

    <!-- 설정 화면 -->
    <div id="settings-screen" class="overlay hidden">
      <div class="panel">
        <h2>설정</h2>
        <label class="field">
          <span>마이크 민감도</span>
          <input id="sensitivity" type="range" min="0" max="100" value="50" />
          <span id="sensitivity-val" class="val">50</span>
        </label>
        <p class="hint">민감도가 높을수록 작은 소리에도 점프해요.</p>

        <label class="toggle">
          <span>효과음</span>
          <input id="sound-toggle" type="checkbox" checked />
        </label>
        <label class="toggle">
          <span>배경음악</span>
          <input id="music-toggle" type="checkbox" checked />
        </label>

        <div class="meter-wrap">
          <span class="meter-label">지금 음량</span>
          <div class="meter"><div id="meter-fill"></div><div id="meter-threshold"></div></div>
        </div>
        <p id="mic-status" class="mic-status"></p>

        <button id="settings-back" class="btn primary">돌아가기</button>
      </div>
    </div>

    <!-- 게임 오버 -->
    <div id="gameover-screen" class="overlay hidden">
      <div class="panel">
        <h2>게임 오버</h2>
        <p class="result"><span id="final-score">0</span> m 달렸어요!</p>
        <p id="best-result" class="best"></p>
        <button id="retry-btn" class="btn primary">다시 하기</button>
        <button id="gameover-settings" class="btn ghost">⚙️ 설정</button>
        <button id="home-btn" class="btn ghost">처음으로</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
