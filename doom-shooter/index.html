<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>둠블래스트 — DOOMBLAST 3D FPS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔫</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,100..400&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500&family=Space+Mono&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../design-tokens.css" />
  <link rel="stylesheet" href="../typography.css" />
  <link rel="stylesheet" href="../polaroid.css" />
  <link rel="stylesheet" href="../pol-ui.css" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="pol-body">
  <div id="app">
    <!-- HUD — 종이 칩(.pol-hud-item) 위 잉크 숫자 -->
    <div id="hud" class="hidden">
      <div id="crosshair"></div>
      <div id="topbar">
        <div class="pol-hud-item hud-stage"><span id="stage" class="pol-hud-value">STAGE 1</span></div>
        <div class="pol-hud-item hud-enemies"><span id="enemies" class="pol-hud-value">ENEMIES 0</span></div>
      </div>
      <div id="bottombar">
        <div id="hp-wrap" class="pol-hud-item">
          <span class="pol-hud-label">체력</span>
          <span class="hp-row">
            <span id="hp-bar"><span id="hp-fill"></span></span>
            <span id="hp-num" class="pol-hud-value">100</span>
          </span>
        </div>
        <div id="ammo" class="pol-hud-item">
          <span class="pol-hud-label">탄약</span>
          <span class="pol-hud-value"><span id="ammo-mag">12</span><span class="sep">/</span><span id="ammo-res">48</span></span>
        </div>
      </div>
      <div id="banner"></div>
    </div>

    <div id="damage"></div>

    <!-- overlays: 로비(메뉴)와 인게임(PAUSED/사망/승리)이 같은 #overlay를 공유.
         game.js showOverlay()가 #o-title/#o-text/#o-controls/#o-btn 콘텐츠를 상태별로 교체한다. -->
    <div id="overlay" class="pol-lobby">
      <div class="pol-lcard">
        <div class="pol-lphoto">
          <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
            <rect class="lp-ground" width="100" height="100" />
            <polygon class="lp-ceil" points="0,0 100,0 66,38 34,38" />
            <polygon class="lp-floor" points="0,100 100,100 66,62 34,62" />
            <polygon class="lp-wall" points="0,0 34,38 34,62 0,100" />
            <polygon class="lp-wall" points="100,0 66,38 66,62 100,100" />
            <rect class="lp-door" x="34" y="38" width="32" height="24" />
            <rect class="lp-exit" x="45" y="46" width="10" height="16" />
            <path class="lp-line" d="M0 0L34 38M100 0L66 38M0 100L34 62M100 100L66 62M17 19V81M83 19V81" />
            <g class="lp-cross">
              <circle cx="50" cy="50" r="7" />
              <path d="M50 37v7M50 56v7M37 50h7M56 50h7" />
            </g>
          </svg>
        </div>
        <span class="pol-lnum">cityzen</span>
        <span class="pol-ltag">doomblast</span>
      </div>
      <h2 id="o-title" class="pol-ltitle">둠블래스트</h2>
      <p id="o-text" class="pol-ldesc">살아남아라.</p>
      <ul id="o-controls">
        <li><kbd class="pol-kbd">WASD</kbd> 이동 · <kbd class="pol-kbd">Shift</kbd> 달리기 · <kbd class="pol-kbd">Space</kbd> 점프</li>
        <li><kbd class="pol-kbd kbd-ko">마우스</kbd> 시점 · <kbd class="pol-kbd kbd-ko">좌클릭</kbd> 발사 · <kbd class="pol-kbd">R</kbd> 재장전 · <kbd class="pol-kbd">1·2·3</kbd> 무기</li>
        <li><kbd class="pol-kbd">Esc</kbd> 일시정지</li>
      </ul>
      <p id="touch-notice" class="pol-alert-warn">터치 기기에서는 시점 조작이 지원되지 않습니다.<br />데스크톱 + 마우스 환경에서 플레이를 권장합니다.</p>
      <button id="o-btn" class="pol-lbtn">시작하기</button>
      <span class="pol-llabel">cityzen &middot; Game - FPS</span>

      <div id="settings" class="pol-panel-quiet" style="display:none">
        <h3 class="pol-eyebrow">설정 · 사운드</h3>
        <label class="set-row"><span class="pol-field-label">전체 음량</span><input id="vol-master" type="range" min="0" max="1" step="0.01" /></label>
        <label class="set-row"><span class="pol-field-label">효과음</span><input id="vol-sfx" type="range" min="0" max="1" step="0.01" /></label>
        <label class="set-row"><span class="pol-field-label">배경음</span><input id="vol-music" type="range" min="0" max="1" step="0.01" /></label>
      </div>
    </div>
  </div>

  <script type="module" src="./js/game.js"></script>
  <a class="pol-back-btn" href="../">&#8592; 게임 허브</a>
</body>
</html>
