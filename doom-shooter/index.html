<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOOMBLAST — 3D Shooter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔫</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,100;1,9..144,200;1,9..144,300&family=Space+Mono&display=swap" />
  <link rel="stylesheet" href="../cityzen-ui.css" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    /* cityzen 공통 헤더가 전체화면 캔버스/오버레이 위에 보이도록 보정 (게임 로직 무관) */
    .cz-gamehead { position: fixed; top: 0; left: 0; right: 0; z-index: 30; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="crosshair"></div>
      <div id="topbar">
        <span id="stage">STAGE 1</span>
        <span id="enemies">ENEMIES 0</span>
      </div>
      <div id="bottombar">
        <div id="hp-wrap"><span class="label">HEALTH</span>
          <div id="hp-bar"><div id="hp-fill"></div></div>
          <span id="hp-num">100</span>
        </div>
        <div id="ammo"><span id="ammo-mag">12</span><span class="sep">/</span><span id="ammo-res">48</span></div>
      </div>
      <div id="banner"></div>
    </div>

    <!-- viewmodel -->
    <div id="muzzle"></div>
    <img id="gun" alt="" />
    <div id="damage"></div>

    <!-- overlays -->
    <div id="overlay" class="pol-lobby">
      <div class="pol-lcard">
        <div class="pol-lphoto" style="background:linear-gradient(145deg,#8a4a3a,#3a1a18)"></div>
        <span class="pol-lnum">cityzen</span>
        <span class="pol-ltag">doom</span>
      </div>
      <h2 class="pol-ltitle">doom</h2>
      <p class="pol-ldesc">살아남아라.</p>
      <button id="o-btn" class="pol-lbtn">시작하기</button>
      <span class="pol-llabel">cityzen &middot; Game - FPS</span>

      <div id="settings" style="display:none">
        <h3>설정 · 사운드</h3>
        <label>전체 음량 <input id="vol-master" type="range" min="0" max="1" step="0.01" /></label>
        <label>효과음 <input id="vol-sfx" type="range" min="0" max="1" step="0.01" /></label>
        <label>배경음 <input id="vol-music" type="range" min="0" max="1" step="0.01" /></label>
      </div>
    </div>
  </div>

  <script type="module" src="./js/game.js"></script>
  <script type="module">
    import { czHeader } from '../cityzen-ui.js';
    czHeader({ title: 'DOOMBLAST' });
  </script>
  <a class="pol-back-btn" href="https://portfolio.cityzen.kr">&#8592; cityzen</a>
</body>
</html>
