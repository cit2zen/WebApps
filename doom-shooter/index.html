<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOOMBLAST — 3D Shooter</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="crosshair"></div>
      <div id="topbar">
        <span id="stage">STAGE 1</span>
        <span id="enemies">ENEMIES 0</span>
      </div>
      <div id="bottombar">
        <div id="hp-wrap"><span class="label">HEALTH</span>
          <div id="hp-bar"><div id="hp-fill"></div></div>
          <span id="hp-num">100</span>
        </div>
        <div id="ammo"><span id="ammo-mag">12</span><span class="sep">/</span><span id="ammo-res">48</span></div>
      </div>
      <div id="banner"></div>
    </div>

    <!-- viewmodel -->
    <div id="muzzle"></div>
    <img id="gun" alt="" />
    <div id="damage"></div>

    <!-- overlays -->
    <div id="overlay">
      <div class="panel">
        <h1 id="o-title">DOOMBLAST</h1>
        <p id="o-text">적을 전멸시키고 빛나는 출구로 탈출하라.<br/>3개 스테이지를 클리어하면 승리.</p>
        <ul id="o-controls">
          <li><b>WASD</b> 이동 · <b>Shift</b> 달리기 · <b>Space</b> 점프</li>
          <li><b>마우스</b> 시점 · <b>좌클릭</b> 발사 · <b>R</b> 재장전</li>
          <li><b>Esc</b> 일시정지</li>
        </ul>
        <button id="o-btn">클릭하여 시작</button>

        <div id="settings">
          <h3>설정 · 사운드</h3>
          <label>전체 음량 <input id="vol-master" type="range" min="0" max="1" step="0.01" /></label>
          <label>효과음 <input id="vol-sfx" type="range" min="0" max="1" step="0.01" /></label>
          <label>배경음 <input id="vol-music" type="range" min="0" max="1" step="0.01" /></label>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/game.js"></script>
</body>
</html>
