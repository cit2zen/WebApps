<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOOMBLAST — 3D Shooter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔫</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../design-tokens.css" />
  <link rel="stylesheet" href="../typography.css" />
  <link rel="stylesheet" href="../polaroid.css" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="crosshair"></div>
      <div id="topbar">
        <span id="stage">STAGE 1</span>
        <span id="enemies">ENEMIES 0</span>
      </div>
      <div id="bottombar">
        <div id="hp-wrap"><span class="label">HEALTH</span>
          <div id="hp-bar"><div id="hp-fill"></div></div>
          <span id="hp-num">100</span>
        </div>
        <div id="ammo"><span id="ammo-mag">12</span><span class="sep">/</span><span id="ammo-res">48</span></div>
      </div>
      <div id="banner"></div>
    </div>

    <div id="damage"></div>

    <!-- overlays: 로비(메뉴)와 인게임(PAUSED/사망/승리)이 같은 #overlay를 공유.
         game.js showOverlay()가 #o-title/#o-text/#o-controls/#o-btn 콘텐츠를 상태별로 교체한다. -->
    <div id="overlay" class="pol-lobby">
      <div class="pol-lcard">
        <div class="pol-lphoto" style="background:linear-gradient(145deg,#8a4a3a,#3a1a18)"></div>
        <span class="pol-lnum">cityzen</span>
        <span class="pol-ltag">doom</span>
      </div>
      <h2 id="o-title" class="pol-ltitle">doom</h2>
      <p id="o-text" class="pol-ldesc">살아남아라.</p>
      <ul id="o-controls">
        <li><b>WASD</b> 이동 · <b>Shift</b> 달리기 · <b>Space</b> 점프</li>
        <li><b>마우스</b> 시점 · <b>좌클릭</b> 발사 · <b>R</b> 재장전 · <b>1·2·3</b> 무기</li>
        <li><b>Esc</b> 일시정지</li>
      </ul>
      <p id="touch-notice">터치 기기에서는 시점 조작이 지원되지 않습니다.<br />데스크톱 + 마우스 환경에서 플레이를 권장합니다.</p>
      <button id="o-btn" class="pol-lbtn">시작하기</button>
      <span class="pol-llabel">cityzen &middot; Game - FPS</span>

      <div id="settings" style="display:none">
        <h3>설정 · 사운드</h3>
        <label>전체 음량 <input id="vol-master" type="range" min="0" max="1" step="0.01" /></label>
        <label>효과음 <input id="vol-sfx" type="range" min="0" max="1" step="0.01" /></label>
        <label>배경음 <input id="vol-music" type="range" min="0" max="1" step="0.01" /></label>
      </div>
    </div>
  </div>

  <script type="module" src="./js/game.js"></script>
  <a class="pol-back-btn" href="https://games.cityzen.kr">&#8592; 게임 허브</a>
</body>
</html>
