<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>onvoicing — 게임 대시보드</title>
  <meta name="description" content="onvoicing — cityzen의 작은 게임 모음">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='86'>✶</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200;0,9..144,300;1,9..144,100;1,9..144,200;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
  <style>
    /* ── Design Tokens (Polaroid Editorial) ── */
    :root {
      --bg-base:   #ece7dc;
      --bg-warm:   #f5f0e8;
      --bg-card:   #ffffff;
      --cream-400: #e0d8cc;
      --gold-mid:  #c0a060;
      --gold-dark: #9a7840;
      --ink-warm:  #1a1005;
      --ink-mid:   #4a3820;
      --ink-light: #a09060;
      --shadow-card:      0 3px 12px rgba(0,0,0,0.18);
      --shadow-card-lift: 0 14px 32px rgba(0,0,0,0.30);
      --font-display: 'Fraunces', serif;
      --pol-ease: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background:
        radial-gradient(1200px 600px at 50% -10%, #f3eee4 0%, var(--bg-base) 60%);
      font-family: var(--font-display);
      color: var(--ink-warm);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .hub {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem 4rem;
      gap: 3.2rem;
    }

    /* ── Header ── */
    .hub-head { text-align: center; }

    .brand {
      font-style: italic;
      font-weight: 200;
      font-size: clamp(2.8rem, 8vw, 4.6rem);
      letter-spacing: 0.01em;
      color: var(--ink-mid);
      line-height: 1;
    }
    .brand .dot { color: var(--gold-mid); }

    .tagline {
      margin-top: 0.9rem;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(0.9rem, 2.4vw, 1.05rem);
      color: var(--ink-light);
      letter-spacing: 0.04em;
    }

    .rule {
      width: 56px;
      height: 1px;
      margin: 1.3rem auto 0;
      background: var(--gold-mid);
      opacity: 0.7;
    }

    /* ── Cards grid ── */
    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4.5rem 5rem;
      padding: 0.5rem 1rem;
    }

    .game {
      --w: 200px;
      position: relative;
      width: var(--w);
      height: 300px;
      text-decoration: none;
      display: block;
      user-select: none;
      outline: none;
    }

    .stack { position: absolute; inset: 0; }

    .card {
      position: absolute;
      left: 50%;
      top: 0;
      width: var(--w);
      margin-left: calc(var(--w) / -2);
      background: var(--bg-card);
      padding: 10px 10px 46px;
      box-shadow: var(--shadow-card);
      transition: transform var(--pol-ease), box-shadow var(--pol-ease);
      will-change: transform;
    }

    /* stacked backs */
    .card.b2 { transform: translate(-16px, 10px) rotate(-7deg); }
    .card.b1 { transform: translate(13px, 6px) rotate(5deg); }
    .card.front {
      transform: translate(0, -2px) rotate(-1.5deg);
      display: flex;
      flex-direction: column;
    }

    .game:hover .card.front,
    .game:focus-visible .card.front {
      transform: translate(0, -16px) rotate(-1.5deg);
      box-shadow: var(--shadow-card-lift);
    }
    .game:hover .card.b1 { transform: translate(26px, 4px) rotate(8deg); }
    .game:hover .card.b2 { transform: translate(-30px, 8px) rotate(-11deg); }
    .game:active .card.front { transform: translate(0, -8px) scale(0.985) rotate(-1.5deg); }

    .photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      background:
        radial-gradient(120px 120px at 50% 35%, #fbf8f2 0%, var(--cream-400) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .deco {
      font-size: 4.2rem;
      line-height: 1;
      filter: saturate(0.9);
      transition: transform var(--pol-ease);
    }
    .game:hover .deco { transform: scale(1.08) rotate(3deg); }

    .caption {
      font-style: italic;
      font-weight: 300;
      font-size: 1.15rem;
      color: var(--ink-mid);
      text-align: center;
      margin-top: 12px;
      letter-spacing: 0.02em;
    }
    .meta {
      font-style: italic;
      font-weight: 300;
      font-size: 0.72rem;
      color: var(--gold-mid);
      text-align: center;
      margin-top: 4px;
      line-height: 1.35;
      padding: 0 4px;
    }

    /* ── Footer ── */
    .hub-foot {
      font-style: italic;
      font-size: 0.78rem;
      color: var(--ink-light);
      letter-spacing: 0.08em;
    }
    .hub-foot a { color: var(--gold-dark); text-decoration: none; }
    .hub-foot a:hover { color: var(--gold-mid); }

    @media (max-width: 520px) {
      .cards { gap: 3.5rem 3rem; }
      .game { --w: 168px; height: 262px; }
    }
  </style>
</head>
<body>
  <main class="hub">
    <header class="hub-head">
      <h1 class="brand">onvoicing<span class="dot">.</span></h1>
      <p class="tagline">cityzen의 작은 게임 모음</p>
      <div class="rule"></div>
    </header>

    <section class="cards">
      <a class="game" href="//balancegame.cityzen.kr" aria-label="VS 월드컵 — 밸런스 게임">
        <div class="stack">
          <div class="card b2"></div>
          <div class="card b1"></div>
          <div class="card front">
            <div class="photo"><span class="deco">⚖</span></div>
            <div class="caption">VS 월드컵</div>
            <div class="meta">밸런스 게임 · 이상형 토너먼트</div>
          </div>
        </div>
      </a>

      <a class="game" href="//onmantle.cityzen.kr" aria-label="onmantle — 단어 의미 추측">
        <div class="stack">
          <div class="card b2"></div>
          <div class="card b1"></div>
          <div class="card front">
            <div class="photo"><span class="deco">🔮</span></div>
            <div class="caption">onmantle</div>
            <div class="meta">온맨틀 · 단어 의미 추측</div>
          </div>
        </div>
      </a>
    </section>

    <footer class="hub-foot">
      <a href="//cityzen.kr">cityzen.kr</a>
    </footer>
  </main>
</body>
</html>
