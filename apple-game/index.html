<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사과게임 — Make 10</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%8E%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,900;1,9..144,100;1,9..144,200;1,9..144,300;1,9..144,500&family=Nunito:wght@700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../design-tokens.css" />
  <link rel="stylesheet" href="../typography.css" />
  <link rel="stylesheet" href="../polaroid.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="scene" id="scene" aria-hidden="true"></div>

  <main class="stage">
    <header class="topbar">
      <div class="brand">
        <h1>사과게임</h1>
        <p>드래그해서 합이 <b>10</b>이 되게</p>
      </div>

      <div class="stats">
        <div class="stat stat--score">
          <span class="stat__label">SCORE · 점수</span>
          <span class="stat__value" id="score" aria-live="polite">0</span>
        </div>
        <div class="stat stat--best">
          <span class="stat__label">BEST · 최고</span>
          <span class="stat__value" id="best">0</span>
        </div>
        <div class="stat stat--time">
          <span class="stat__label">TIME · 시간</span>
          <span class="stat__value" id="time" aria-live="off">2:00</span>
        </div>
      </div>
    </header>

    <div class="timebar"><span class="timebar__fill" id="timebar"></span></div>

    <section class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="selrect" id="selrect" hidden></div>

      <div class="overlay pol-lobby" id="overlay" hidden>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
        <div class="overlay__card">
          <p class="overlay__kicker" id="overlayKicker">TIME'S UP</p>
          <h2 class="overlay__score" id="finalScore">0</h2>
          <p class="overlay__sub" id="overlaySub">사과를 수확했어요</p>
          <button class="btn" id="replay">다시 하기</button>
        </div>
      </div>
    </section>

    <footer class="actionbar">
      <button class="btn btn--ghost" id="reset">새 게임</button>
    </footer>
  </main>

  <!-- 시작 게이트: 첫 화면. '시작하기'를 눌러야 보드 생성·타이머 시작 -->
  <div class="pol-lobby" id="startOverlay">
    <div class="pol-lcard">
      <div class="pol-lphoto" aria-hidden="true">&#127822;</div>
      <span class="pol-lnum">&#8470; 01 &mdash; make ten</span>
      <span class="pol-ltag">apple game</span>
    </div>
    <h2 class="pol-ltitle">사과게임</h2>
    <p class="pol-ldesc">드래그해서 사과 숫자의 합이 10이 되면 수확! 제한시간 2분 동안 최대한 많이 모아보세요.</p>
    <button class="pol-lbtn" id="start">시작하기</button>
    <span class="pol-llabel">drag &middot; sum to 10 &middot; 2:00</span>
  </div>

  <a class="pol-back-btn" href="https://games.cityzen.kr">&#8592; 게임 허브</a>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
