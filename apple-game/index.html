<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사과게임 — Make 10</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%8E%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,100..400&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500&family=Space+Mono&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../design-tokens.css" />
  <link rel="stylesheet" href="../typography.css" />
  <link rel="stylesheet" href="../polaroid.css" />
  <link rel="stylesheet" href="../pol-ui.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="pol-body">
  <div class="scene" id="scene" aria-hidden="true"></div>

  <main class="stage">
    <header class="topbar">
      <div class="brand">
        <h1 class="t-display">사과게임</h1>
        <p class="t-small">드래그해서 합이 <b>10</b>이 되게</p>
      </div>

      <div class="stats pol-hud">
        <div class="stat stat--score pol-hud-item">
          <span class="pol-hud-label">점수</span>
          <span class="pol-hud-value" id="score" aria-live="polite">0</span>
        </div>
        <div class="stat stat--best pol-hud-item">
          <span class="pol-hud-label">최고</span>
          <span class="pol-hud-value" id="best">0</span>
        </div>
        <div class="stat stat--time pol-hud-item">
          <span class="pol-hud-label">남은 시간</span>
          <span class="pol-hud-value" id="time" aria-live="off">2:00</span>
        </div>
      </div>
    </header>

    <div class="timebar"><span class="timebar__fill" id="timebar"></span></div>

    <section class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="selrect" id="selrect" hidden></div>
    </section>

    <footer class="actionbar">
      <button class="pol-btn-ghost" id="reset">새 게임</button>
    </footer>
  </main>

  <!-- 결과 화면(시간 종료·클리어) -->
  <div class="pol-overlay result" id="overlay" hidden>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="pol-dialog result__card" role="dialog" aria-modal="true" aria-labelledby="overlayKicker finalScore">
      <p class="pol-eyebrow result__kicker" id="overlayKicker">TIME'S UP</p>
      <h2 class="result__score" id="finalScore">0</h2>
      <p class="result__sub" id="overlaySub">사과를 수확했어요</p>
      <button class="pol-btn-primary pol-btn-lg" id="replay">다시 하기</button>
    </div>
  </div>

  <!-- 시작 게이트: 첫 화면. '시작하기'를 눌러야 보드 생성·타이머 시작 -->
  <div class="pol-lobby" id="startOverlay">
    <div class="pol-lcard">
      <div class="pol-lphoto">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="합이 10인 사과 두 개를 드래그로 묶는 그림">
          <rect class="lp-bg" width="100" height="100" />
          <rect class="lp-sel" x="11" y="29" width="78" height="46" rx="4" />
          <path class="lp-stem" d="M32 39 Q33 33 36 30 M68 39 Q69 33 72 30" />
          <path class="lp-leaf" d="M34 34 Q41 27 47 31 Q41 37 34 34 Z M70 34 Q77 27 83 31 Q77 37 70 34 Z" />
          <circle class="lp-apple" cx="32" cy="54" r="14" />
          <circle class="lp-apple" cx="68" cy="54" r="14" />
          <ellipse class="lp-glint" cx="27" cy="47" rx="3.6" ry="2.6" />
          <ellipse class="lp-glint" cx="63" cy="47" rx="3.6" ry="2.6" />
          <text class="lp-num" x="32" y="60" text-anchor="middle" font-size="16">4</text>
          <text class="lp-num" x="68" y="60" text-anchor="middle" font-size="16">6</text>
          <text class="lp-sum" x="50" y="92" text-anchor="middle" font-size="12">= 10</text>
        </svg>
      </div>
      <span class="pol-lnum">&#8470; 01 &mdash; make ten</span>
      <span class="pol-ltag">apple game</span>
    </div>
    <h2 class="pol-ltitle">사과게임</h2>
    <p class="pol-ldesc">드래그해서 사과 숫자의 합이 10이 되면 수확! 제한시간 2분 동안 최대한 많이 모아보세요.</p>
    <button class="pol-lbtn" id="start">시작하기</button>
    <span class="pol-llabel">drag &middot; sum to 10 &middot; 2:00</span>
  </div>

  <a class="pol-back-btn" href="../">&#8592; 게임 허브</a>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
