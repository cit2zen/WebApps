<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사과게임 — Make 10</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%8E%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="scene" id="scene" aria-hidden="true"></div>

  <main class="stage">
    <header class="topbar">
      <div class="brand">
        <h1>사과게임</h1>
        <p>드래그해서 합이 <b>10</b>이 되게</p>
      </div>

      <div class="stats">
        <div class="stat stat--score">
          <span class="stat__label">SCORE</span>
          <span class="stat__value" id="score">0</span>
        </div>
        <div class="stat stat--time">
          <span class="stat__label">TIME</span>
          <span class="stat__value" id="time">2:00</span>
        </div>
      </div>
    </header>

    <div class="timebar"><span class="timebar__fill" id="timebar"></span></div>

    <section class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="selrect" id="selrect" hidden></div>

      <div class="overlay" id="overlay" hidden>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
        <div class="overlay__card">
          <p class="overlay__kicker" id="overlayKicker">TIME'S UP</p>
          <h2 class="overlay__score" id="finalScore">0</h2>
          <p class="overlay__sub" id="overlaySub">사과를 수확했어요</p>
          <button class="btn" id="replay">다시 하기</button>
        </div>
      </div>
    </section>

    <footer class="actionbar">
      <button class="btn btn--ghost" id="reset">새 게임</button>
    </footer>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
