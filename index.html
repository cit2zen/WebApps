<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cityzen games</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1e293b, #0b1120 70%); color: #e2e8f0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem;
    }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 .25rem; }
    p.sub { color: #94a3b8; margin: 0 0 2.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; width: min(640px, 100%); }
    a.card {
      display: flex; flex-direction: column; align-items: center; gap: .5rem; padding: 1.6rem 1rem;
      background: #111827; border: 1px solid #1f2937; border-radius: 14px; text-decoration: none; color: #e2e8f0;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    a.card:hover { transform: translateY(-3px); border-color: #6366f1; background: #161e2e; }
    .emoji { font-size: 2.4rem; }
    .name { font-weight: 600; }
    footer { margin-top: 2.5rem; color: #64748b; font-size: .85rem; }
    footer a { color: #818cf8; text-decoration: none; }
  </style>
</head>
<body>
  <h1>🎮 cityzen games</h1>
  <p class="sub">바닐라 JS로 만든 브라우저 게임 모음</p>
  <nav class="grid">
    <a class="card" href="./pacman/"><span class="emoji">👻</span><span class="name">Pac-Man</span></a>
    <a class="card" href="./tetris/"><span class="emoji">🧱</span><span class="name">Tetris</span></a>
    <a class="card" href="./apple-game/"><span class="emoji">🍎</span><span class="name">Apple Game</span></a>
    <a class="card" href="./yaong/"><span class="emoji">🐱</span><span class="name">Yaong</span></a>
  </nav>
  <footer><a href="https://cityzen.kr">← cityzen.kr</a></footer>
</body>
</html>
