<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cityzen games</title>
  <meta name="description" content="cityzen이 직접 만들어 운영하는 브라우저 게임 모음 — 설치 없이, 광고 없이, 빠르게." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ece7dc'/%3E%3Cg transform='rotate(-5 16 16)'%3E%3Crect x='6' y='3.5' width='20' height='25' fill='%23ffffff'/%3E%3Crect x='8.5' y='6' width='15' height='15' fill='%23e0d8cc'/%3E%3Crect x='10' y='23.5' width='12' height='1.8' fill='%23c0a060'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./design-tokens.css">
  <link rel="stylesheet" href="./typography.css">
  <link rel="stylesheet" href="./polaroid.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-base);
      color: var(--ink-warm);
      min-height: 100vh;
      overflow-x: hidden;
      word-break: keep-all;
    }

    /* ── Masthead ── */
    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 36px 48px 24px;
      border-bottom: 1px solid var(--rule-color);
    }
    .masthead-brand {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      color: var(--ink-warm);
      letter-spacing: -0.02em;
      line-height: 1;
      text-decoration: none;
      transition: color .2s;
    }
    .masthead-brand:hover { color: var(--gold-dark); }
    .masthead-meta { text-align: right; }
    .masthead-meta .t-label { display: block; }
    .masthead-meta .t-label + .t-label { margin-top: 4px; }

    /* ── Hero ── */
    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 40px;
      padding: 56px 48px 32px;
      max-width: 1080px;
      margin: 0 auto;
    }
    .hero-copy { max-width: 360px; }
    .hero-copy .t-display { line-height: 1.0; margin-bottom: 20px; }
    .hero-copy .t-body { max-width: 300px; }
    .hero-kicker { display: block; margin-bottom: 14px; }
    .hero-hint {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 300;
      font-size: 0.72rem;
      color: var(--ink-light);
      margin-top: 24px;
    }
    .hero-group-wrap { min-width: 480px; }
    .hero-group { min-height: 340px; }

    /* ── Section divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 48px;
      margin: 16px 0 44px;
      max-width: 1080px;
      margin-left: auto;
      margin-right: auto;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule-color);
    }
    .divider-label {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 300;
      font-size: 0.8rem;
      color: var(--gold-mid);
      letter-spacing: 0.12em;
      white-space: nowrap;
    }

    /* ── Card grid ── */
    .grid-section {
      padding: 0 48px 64px;
      max-width: 1080px;
      margin: 0 auto;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(186px, 1fr));
      gap: 36px 20px;
      justify-items: center;
    }
    .card-link {
      text-decoration: none;
      display: block;
      transition: transform .3s var(--pol-ease);
    }
    a.card-link:hover { transform: translateY(-4px); }
    a.card-link:hover .pol-card {
      box-shadow: var(--shadow-card-lift);
      transform: rotate(0deg);
    }
    .grid-card {
      transform: rotate(var(--rot, 0deg));
      transition: transform .3s var(--pol-ease), box-shadow .3s;
    }
    .card-link.is-soon { cursor: default; }
    .card-link.is-soon .pol-card { opacity: .65; }

    /* Emoji photo */
    .ph-emoji {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      background: linear-gradient(145deg, var(--cream-100), var(--cream-400));
      user-select: none;
    }

    /* Category tag in caption */
    .pol-tag {
      font-family: var(--font-mono);
      font-size: 0.52rem;
      color: var(--ink-light);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: block;
      margin-top: 3px;
      text-align: center;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--rule-color);
      padding: 26px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-link {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 300;
      font-size: 0.85rem;
      color: var(--gold-mid);
      text-decoration: none;
      transition: color .2s;
    }
    .footer-link:hover { color: var(--ink-warm); }

    /* ── Mobile ── */
    @media (max-width: 900px) {
      .masthead { padding: 26px 24px 18px; }
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 40px 24px 24px;
      }
      .hero-copy { max-width: none; margin: 0 auto; }
      .hero-copy .t-body { max-width: none; }
      .hero-group-wrap { min-width: auto; }
      .grid-section { padding: 0 24px 52px; }
      .divider { padding: 0 24px; }
      footer { padding: 22px 24px; flex-direction: column; gap: 10px; text-align: center; }
    }
    @media (max-width: 640px) {
      .hero-group-wrap, .hero-hint { display: none; }
      .card-grid { grid-template-columns: repeat(2, 1fr); gap: 24px 12px; }
    }
  </style>
</head>
<body>

  <!-- ── Masthead ── -->
  <header class="masthead">
    <a class="masthead-brand" href="https://cityzen.kr">cityzen</a>
    <div class="masthead-meta">
      <span class="t-label">games</span>
      <span class="t-label">2026</span>
    </div>
  </header>

  <!-- ── Hero ── -->
  <section class="hero">
    <div class="hero-copy">
      <span class="t-label hero-kicker">직접 만들어 운영 · 광고 없음</span>
      <h1 class="t-display">브라우저에서<br>바로 플레이.</h1>
      <p class="t-body">설치 없이 즐기는 바닐라 JS 게임 모음. 가볍고 빠르게, 광고 없이.</p>
      <p class="hero-hint" id="heroHint">카드를 클릭해서 펼치기 →</p>
    </div>
    <div class="hero-group-wrap" aria-hidden="true">
      <div class="pol-group hero-group" id="heroGroup">
        <div class="pol-card">
          <div class="pol-photo ph-emoji">👻</div>
          <span class="pol-num">01</span>
          <p class="pol-caption">팩맨</p>
        </div>
        <div class="pol-card">
          <div class="pol-photo ph-emoji">🧱</div>
          <span class="pol-num">02</span>
          <p class="pol-caption">테트리스</p>
        </div>
        <div class="pol-card">
          <div class="pol-photo ph-emoji">🍎</div>
          <span class="pol-num">03</span>
          <p class="pol-caption">사과게임</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ── Games ── -->
  <div class="divider"><span class="divider-label">Games</span></div>
  <section class="grid-section">
    <nav class="card-grid" aria-label="게임 목록" id="grid-games"></nav>
  </section>

  <!-- ── cityzen 앱 ── -->
  <div class="divider"><span class="divider-label">cityzen 앱</span></div>
  <section class="grid-section">
    <div class="card-grid" aria-label="앱 목록" id="grid-apps"></div>
  </section>

  <!-- ── Footer ── -->
  <footer>
    <a class="footer-link" href="https://cityzen.kr">← cityzen.kr</a>
    <span class="t-label">© 2026 cityzen · 직접 만들어 운영 · 광고 없음</span>
  </footer>

  <script>
    // 게임/앱 메타데이터 — 타일·카드를 한 곳에서 렌더(일관·확장 용이).
    const games = [
      { e: '👻', n: '팩맨',           tag: 'arcade', href: './pacman/' },
      { e: '🧱', n: '테트리스',       tag: 'puzzle', href: './tetris/' },
      { e: '🍎', n: '사과게임',       tag: 'puzzle', href: './apple-game/' },
      { e: '🐱', n: '야옹',           tag: 'cat',    href: './yaong/' },
      { e: '🔫', n: '둠블래스트',     tag: 'fps',    href: './doom-shooter/' },
      { e: '✋', n: '오로라 핸드',    tag: 'vision', href: './aurora-hands/' },
      { e: '🧠', n: '딥러닝 강의노트', tag: 'study',  href: './deeplearning/' },
    ];

    const apps = [
      { e: '🧠', n: 'onmantle',    tag: '한국어 단어 유사도',   href: 'https://onmantle.cityzen.kr' },
      { e: '⚖️', n: 'balancegame', tag: 'VS 밸런스 게임',       href: 'https://balancegame.cityzen.kr' },
      { e: '🎤', n: 'onvoicing',   tag: 'onvoicing 게임 허브',  href: 'https://onvoicing.cityzen.kr' },
      { e: '🗂', n: 'portfolio',   tag: '전체 작업물',          href: 'https://portfolio.cityzen.kr' },
      { e: '🎙️', n: 'AURA',        tag: '음성 AI · 준비 중',    soon: true },
    ];

    // 안전한 DOM 생성(문자열 HTML 미사용 → XSS 차단).
    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };
    const isExternal = (href) => /^https?:\/\//.test(href);
    const ROTS = [-3, 2.5, -2, 1.5, -2.5, 2, -1.5, 1, -2, 2.5, -1, 1.5];

    // 폴라로이드 카드 1장 생성(이모지 사진 + 번호 + 캡션).
    const makeCard = (item, num) => {
      const card = el('div', 'pol-card grid-card');
      card.style.setProperty('--rot', ROTS[(num - 1) % ROTS.length] + 'deg');
      const photo = el('div', 'pol-photo ph-emoji', item.e);
      photo.setAttribute('aria-hidden', 'true');
      const cap = el('p', 'pol-caption', item.n);
      cap.append(el('span', 'pol-tag', item.tag));
      card.append(photo, el('span', 'pol-num', String(num).padStart(2, '0')), cap);
      return card;
    };

    let num = 0;

    const gamesRoot = document.getElementById('grid-games');
    for (const g of games) {
      const a = el('a', 'card-link');
      a.href = g.href;
      a.setAttribute('aria-label', `${g.n} 플레이`);
      a.append(makeCard(g, ++num));
      gamesRoot.append(a);
    }

    const appsRoot = document.getElementById('grid-apps');
    for (const app of apps) {
      ++num;
      // 라이브 앱은 링크(<a>), 준비 중 앱은 비활성 카드(<div>).
      if (app.soon) {
        const d = el('div', 'card-link is-soon');
        d.setAttribute('aria-disabled', 'true');
        d.append(makeCard(app, num));
        appsRoot.append(d);
        continue;
      }
      const a = el('a', 'card-link');
      a.href = app.href;
      if (isExternal(app.href)) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.setAttribute('aria-label', `${app.n} (새 탭에서 열림)`);
      }
      a.append(makeCard(app, num));
      appsRoot.append(a);
    }

    // Cascade ↔ Pyramid 토글 (장식용 히어로 그룹).
    const heroGroup = document.getElementById('heroGroup');
    const heroHint = document.getElementById('heroHint');
    heroGroup.addEventListener('click', () => {
      heroGroup.classList.toggle('open');
      heroHint.textContent = heroGroup.classList.contains('open')
        ? '← 다시 클릭해서 접기'
        : '카드를 클릭해서 펼치기 →';
    });
  </script>
</body>
</html>
