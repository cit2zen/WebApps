<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Overclock Arena</title>
    <link rel="icon" href="data:,">
    <style>
      /* 폰트: TemplateData/fonts (OFL, 빌드 동봉 — 외부 요청 없음) */
      @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 600; src: url("TemplateData/fonts/Fraunces-SemiBoldItalic.ttf") format("truetype"); font-display: swap; }
      @font-face { font-family: "Orbitron"; font-weight: 700; src: url("TemplateData/fonts/Orbitron-Bold.ttf") format("truetype"); font-display: swap; }
      /* 토큰: Polaroid Editorial(develop_web/design-system) + 게임 네온 */
      :root {
        --bg-base: #ece7dc; --bg-card: #ffffff; --gold-mid: #c0a060; --gold-light: #d4b87a; --ink-warm: #1a1005; --ink-mid: #4a3820;
        --void: #0b0d17; --neon-cyan: #27e0ff; --neon-magenta: #ff2e88; --track: rgba(26, 16, 5, 0.12);
        --shadow-card: 0 12px 32px rgba(26, 16, 5, 0.18);
      }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--void); overflow: hidden; }
      /* 모바일: 스크롤·핀치 줌·더블탭 줌·길게 눌러 선택/콜아웃·탭 하이라이트 차단(가상 컨트롤이 제스처를 전부 받는다) */
      html, body { position: fixed; inset: 0; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--void); outline: none; touch-action: none; }
      .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg-base); transition: opacity 0.5s ease; }
      .screen.hide { opacity: 0; pointer-events: none; }
      .card { width: min(420px, 86vw); background: var(--bg-card); padding: 16px 16px 20px; box-shadow: var(--shadow-card); }
      .photo { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: linear-gradient(to bottom, #07080f 0%, #1a0f2e 52%, #3a1238 60%, var(--void) 60.5%); }
      .photo::before { content: ""; position: absolute; left: -50%; right: -50%; top: 60%; bottom: -40%; transform: perspective(220px) rotateX(58deg); transform-origin: top;
        background-image: linear-gradient(var(--neon-cyan) 1px, transparent 1px), linear-gradient(90deg, var(--neon-cyan) 1px, transparent 1px);
        background-size: 32px 32px; opacity: 0.55; animation: scroll 1.6s linear infinite; }
      .photo::after { content: ""; position: absolute; left: 50%; top: 42%; width: 38%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 46, 136, 0.9) 0%, rgba(255, 46, 136, 0.25) 45%, transparent 70%); filter: blur(2px); }
      @keyframes scroll { from { background-position: 0 0; } to { background-position: 0 32px; } }
      .caption { text-align: center; padding-top: 14px; color: var(--ink-warm); }
      .title { font: italic 600 30px/1.1 "Fraunces", Georgia, serif; color: var(--gold-mid); letter-spacing: 0.01em; }
      .sub { margin-top: 8px; font: 700 11px/1.4 "Orbitron", system-ui, sans-serif; letter-spacing: 0.16em; color: var(--ink-mid); text-transform: uppercase; }
      .bar { margin: 16px auto 0; width: 70%; height: 3px; background: var(--track); }
      .fill { width: 0; height: 100%; background: var(--gold-mid); transition: width 0.2s; }
      .pct { margin-top: 8px; font: 700 12px "Orbitron", system-ui, sans-serif; color: var(--gold-mid); letter-spacing: 0.12em; }
      .msg { margin-top: 10px; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink-mid); }
      .btns { display: flex; gap: 10px; margin-top: 16px; }
      .btn { flex: 1; min-height: 52px; border: 1px solid rgba(26, 16, 5, 0.25); background: transparent; color: var(--ink-warm); font: 700 12px "Orbitron", system-ui, sans-serif; letter-spacing: 0.1em; cursor: pointer; }
      .btn.primary { background: var(--ink-warm); color: var(--bg-card); border-color: var(--ink-warm); }
    </style>
    <script>
      // CrazyGames SDK v3 브리지(Plugins/WebGL/FpsPortal.jslib가 읽는다). 포털 호스트(*.crazygames.* · 1001juegos.com) 또는
      // ?useLocalSdk=true(로컬 QA)일 때만 SDK를 불러온다 — 그 밖(games.cityzen.kr)은 state 3(비활성)이고 모든 호출이 no-op.
      // SDK는 await init() 전엔 쓸 수 없어 그 전 호출(loadingStart 등)은 큐에 쌓았다가 순서대로 보낸다
      window.FpsPortal = (function () {
        var host = location.hostname;
        var want = /(^|\.)crazygames\.[a-z.]+$/.test(host) || /(^|\.)1001juegos\.com$/.test(host) || /[?&]useLocalSdk=true(&|$)/.test(location.search);
        var p = { state: want ? 1 : 3, portal: want, sdk: null, queue: [] };
        function ready() { return p.state === 2; }
        p.call = function (fn) {
          if (p.state === 1) { p.queue.push(fn); return; }
          if (!ready()) return;
          try { if (typeof p.sdk.game[fn] === "function") p.sdk.game[fn](); } catch (e) { console.warn("[portal]", fn, e); }
        };
        p.requestAd = function (type, send) {
          if (!ready()) return false;
          try {
            p.sdk.ad.requestAd(type, {
              adStarted: function () { send("started|" + type); },
              adFinished: function () { send("finished|" + type); },
              adError: function (e) { send("error|" + type + "|" + ((e && e.code) || "other")); },
            });
            return true;
          } catch (e) { console.warn("[portal] requestAd", e); return false; }
        };
        p.muted = function () { try { return ready() && !!p.sdk.game.settings.muteAudio; } catch (e) { return false; } };
        p.locale = function () { try { return ready() ? String(p.sdk.user.systemInfo.locale || "") : ""; } catch (e) { return ""; } };
        function off(e) { if (e) console.warn("[portal] SDK off", e); p.state = 3; p.queue = []; }
        if (want) {
          var s = document.createElement("script");
          s.src = "https://sdk.crazygames.com/crazygames-sdk-v3.js";
          s.onerror = function () { off("load failed"); };
          s.onload = function () {
            var sdk = window.CrazyGames && window.CrazyGames.SDK;
            if (!sdk) return off("missing");
            sdk.init().then(function () {
              if (sdk.environment !== "crazygames" && sdk.environment !== "local") return off("environment " + sdk.environment);
              p.sdk = sdk;
              p.state = 2;
              var q = p.queue; p.queue = [];
              q.forEach(p.call);
            }).catch(off);
          };
          document.head.appendChild(s);
        }
        return p;
      })();
    </script>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="loader" class="screen">
      <div class="card">
        <div class="photo"></div>
        <div class="caption">
          <div class="title" id="loader-title"></div>
          <div class="sub">Mouse &amp; keyboard · Headphones on</div>
          <div class="bar"><div class="fill" id="fill"></div></div>
          <div class="pct" id="pct">0%</div>
        </div>
      </div>
    </div>

    <div id="touch-start" class="screen hide">
      <div class="card">
        <div class="photo"></div>
        <div class="caption">
          <div class="title" id="mobile-title"></div>
          <div class="msg" id="mobile-msg"></div>
          <div class="btns">
            <button class="btn primary" id="tap-start" type="button"></button>
          </div>
        </div>
      </div>
    </div>

    <script src="Build/WebGL.loader.js"></script>
    <script>
      var PRODUCT = "Overclock Arena";
      var loader = document.getElementById("loader");
      var mobile = document.getElementById("touch-start");
      // 터치 전용 기기(휴대폰·태블릿): 가상 컨트롤로 플레이. 마우스가 있는 기기는 바로 로딩
      var touchOnly = window.matchMedia && matchMedia("(pointer: coarse)").matches && !matchMedia("(pointer: fine)").matches;
      document.getElementById("loader-title").textContent = PRODUCT;
      document.getElementById("mobile-title").textContent = PRODUCT;
      document.getElementById("mobile-msg").textContent = "가로 화면을 권장해요 · Landscape recommended";
      document.getElementById("tap-start").textContent = "탭하여 시작 · Tap to start";
      if (touchOnly) document.querySelector("#loader .sub").textContent = "Touch controls · Headphones on";

      // 길게 누르기 메뉴·iOS 제스처 줌·페이지 스크롤 차단(캔버스 입력은 Unity가 받는다)
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
      document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || e.target !== document.getElementById("unity-canvas")) e.preventDefault(); }, { passive: false });

      function start() {
        mobile.classList.add("hide");
        loader.classList.remove("hide");
        window.FpsPortal.call("loadingStart"); // 포털: 로딩 구간 표시(포털 밖 no-op)
        createUnityInstance(document.getElementById("unity-canvas"), {
          arguments: [],
          dataUrl: "Build/WebGL.data.unityweb",
          frameworkUrl: "Build/WebGL.framework.js.unityweb",
          codeUrl: "Build/WebGL.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "cityzen",
          productName: PRODUCT,
          productVersion: "1.0",
          autoSyncPersistentDataPath: true,
          // 모바일 GPU 부하: 렌더 해상도 상한 DPR 1.5(데스크톱은 기기 값 그대로)
          devicePixelRatio: touchOnly ? Math.min(window.devicePixelRatio || 1, 1.5) : undefined,
          // 포인터 락 거부(iframe 권한·헤드리스 등)는 치명 오류가 아니다 — 경고만 남기고 로더 alert를 막는다
          errorHandler: function (message) {
            if (/pointer ?lock/i.test(String(message))) { console.warn(message); return true; }
            return false;
          },
        }, function (progress) {
          document.getElementById("fill").style.width = (progress * 100) + "%";
          document.getElementById("pct").textContent = Math.round(progress * 100) + "%";
        }).then(function (unityInstance) {
          window.unityInstance = unityInstance;
          // iPadOS 등 데스크톱 UA 터치 기기도 가상 컨트롤을 켜도록 힌트(GameManager.TouchHint → InputMap.HintTouch)
          if (touchOnly) { try { unityInstance.SendMessage("Game", "TouchHint"); } catch (e) { console.warn("[touch] hint", e); } }
          window.FpsPortal.call("loadingStop");
          loader.classList.add("hide");
          setTimeout(function () { loader.remove(); }, 600);
          document.getElementById("unity-canvas").focus();
        }).catch(function (message) {
          document.getElementById("pct").textContent = String(message);
        });
      }

      // 터치 기기: "탭하여 시작"(사용자 제스처 = 오디오 잠금 해제 + 전체 화면·가로 고정 시도, 포털 안에선 포털이 전체 화면을 맡는다)
      var started = false;
      function tapStart() {
        if (started) return;
        started = true;
        if (!window.FpsPortal.portal) {
          try {
            var el = document.documentElement, fs = el.requestFullscreen || el.webkitRequestFullscreen;
            var p = fs ? fs.call(el) : null;
            var lock = function () { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); } catch (e) {} };
            if (p && p.then) p.then(lock).catch(function () {}); else lock();
          } catch (e) { console.warn("[touch] fullscreen", e); }
        }
        start();
      }
      mobile.addEventListener("click", tapStart);
      if (touchOnly) { loader.classList.add("hide"); mobile.classList.remove("hide"); }
      else start();
    </script>
  </body>
</html>
