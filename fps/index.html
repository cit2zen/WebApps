<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Overclock Arena</title>
    <link rel="icon" href="data:,">
    <!-- Polaroid Editorial v2 — 게임 허브(games.cityzen.kr) 루트의 키트를 상대 경로로 링크 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,100..400&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500&family=Space+Mono&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../design-tokens.css">
    <link rel="stylesheet" href="../typography.css">
    <link rel="stylesheet" href="../polaroid.css">
    <link rel="stylesheet" href="../pol-ui.css">
    <style>
      /* 셸(Unity 캔버스 밖) 전용 — 색·크기는 키트 토큰만 쓴다 */
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      /* 모바일: 스크롤·핀치 줌·더블탭 줌·길게 눌러 선택/콜아웃·탭 하이라이트 차단(가상 컨트롤이 제스처를 전부 받는다) */
      html, body { position: fixed; inset: 0; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      body.is-playing.pol-body::after { display: none; } /* 플레이 중엔 인화지 결 오버레이를 끈다(WebGL 위 합성 비용) */
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg-base); outline: none; touch-action: none; }
      .pol-back-btn { display: inline-flex; align-items: center; min-height: 40px; box-sizing: border-box; } /* 허브 버튼 터치 목표 ≥ 40px */
      /* 로딩·탭하여 시작 = 게임 로비 카드(.pol-lobby). .hide = 페이드 아웃(JS가 토글) */
      .fps-lobby { transition: opacity var(--dur-slow) ease; }
      .fps-lobby.hide { opacity: 0; pointer-events: none; }
      #touch-start { cursor: pointer; }
      .fps-col { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
      .fps-col .pol-ltitle { margin-top: var(--space-1); }
      .fps-sub { margin: 0; }
      .fps-bar { width: min(260px, 70vw); height: 4px; margin-top: var(--space-3); background: var(--cream-400); border-radius: var(--r-pill); overflow: hidden; }
      .fps-fill { width: 0; height: 100%; background: var(--gold-mid); transition: width var(--dur-base) var(--ease-out); }
      .fps-pct { max-width: min(360px, 86vw); overflow-wrap: anywhere; }
      .fps-lobby.is-error .fps-bar { display: none; }
      .fps-lobby.is-error .fps-pct { font-family: var(--font-body); font-style: normal; font-size: var(--fs-sm); color: var(--pol-danger); }
      /* 포토: 인화지 위 아레나 — 지는 해 · 원근 격자 · 조준선 */
      .lp-sky, .lp-band { fill: var(--cream-100); }
      .lp-sun { fill: var(--gold-light); }
      .lp-ground { fill: var(--cream-300); }
      .lp-grid { fill: none; stroke: var(--gold-mid); stroke-width: 0.6; }
      .lp-horizon { stroke: var(--ink-mid); stroke-width: 0.8; }
      .lp-cross { fill: none; stroke: var(--ink-warm); stroke-width: 1.3; stroke-linecap: round; }
      .lp-dot { fill: var(--ink-warm); }
      /* 가로 휴대폰(높이 ≤ 520px): 카드 | 문구 두 칸 */
      @media (max-height: 520px) and (orientation: landscape) {
        .fps-lobby { flex-direction: row; gap: var(--space-7); }
        .fps-lobby .fps-col { align-items: flex-start; text-align: left; }
      }
    </style>
    <script>
      // CrazyGames SDK v3 브리지(Plugins/WebGL/FpsPortal.jslib가 읽는다). 포털 호스트(*.crazygames.* · 1001juegos.com) 또는
      // ?useLocalSdk=true(로컬 QA)일 때만 SDK를 불러온다 — 그 밖(games.cityzen.kr)은 state 3(비활성)이고 모든 호출이 no-op.
      // SDK는 await init() 전엔 쓸 수 없어 그 전 호출(loadingStart 등)은 큐에 쌓았다가 순서대로 보낸다
      window.FpsPortal = (function () {
        var host = location.hostname;
        // iframe 안(포털·QA 미리보기·파트너 도메인)이면 SDK를 불러 environment로 판정 — crazygames|local이 아니면 off
        var framed = false;
        try { framed = window.self !== window.top; } catch (e) { framed = true; }
        var want = framed || /(^|\.)crazygames\.[a-z.]+$/.test(host) || /(^|\.)1001juegos\.com$/.test(host) || /[?&]useLocalSdk=true(&|$)/.test(location.search);
        var p = { state: want ? 1 : 3, portal: want, sdk: null, queue: [] };
        function ready() { return p.state === 2; }
        p.call = function (fn) {
          if (p.state === 1) { p.queue.push(fn); return; }
          if (!ready()) return;
          try { if (typeof p.sdk.game[fn] === "function") p.sdk.game[fn](); } catch (e) { console.warn("[portal]", fn, e); }
        };
        p.requestAd = function (type, send) {
          if (!ready()) return false;
          try {
            p.sdk.ad.requestAd(type, {
              adStarted: function () { send("started|" + type); },
              adFinished: function () { send("finished|" + type); },
              adError: function (e) { send("error|" + type + "|" + ((e && e.code) || "other")); },
            });
            return true;
          } catch (e) { console.warn("[portal] requestAd", e); return false; }
        };
        p.muted = function () { try { return ready() && !!p.sdk.game.settings.muteAudio; } catch (e) { return false; } };
        p.locale = function () { try { return ready() ? String(p.sdk.user.systemInfo.locale || "") : ""; } catch (e) { return ""; } };
        // Data 모듈(진행 저장, localStorage와 같은 동기 API · 문자열) — 준비 전·포털 밖은 null/no-op → C# Prefs가 PlayerPrefs로 폴백
        p.dataGet = function (k) { try { return ready() ? p.sdk.data.getItem(k) : null; } catch (e) { return null; } };
        p.dataSet = function (k, v) { try { if (ready()) p.sdk.data.setItem(k, v); } catch (e) { console.warn("[portal] data", e); } };
        p.dataDel = function (k) { try { if (ready()) p.sdk.data.removeItem(k); } catch (e) {} };
        // SDK init이 끝나거나(성공·실패) 8초가 지나면 cb — Unity 시작 전에 Data 모듈이 준비되도록 로더가 기다린다
        var waiters = [];
        function settle() { var w = waiters; waiters = []; w.forEach(function (f) { f(); }); }
        p.settled = function (cb) {
          if (p.state !== 1) return cb();
          waiters.push(cb);
          setTimeout(function () { if (p.state === 1) off("init timeout"); settle(); }, 8000);
        };
        function off(e) { if (e) console.warn("[portal] SDK off", e); p.state = 3; p.queue = []; settle(); }
        if (want) {
          var s = document.createElement("script");
          s.src = "https://sdk.crazygames.com/crazygames-sdk-v3.js";
          s.onerror = function () { off("load failed"); };
          s.onload = function () {
            var sdk = window.CrazyGames && window.CrazyGames.SDK;
            if (!sdk) return off("missing");
            sdk.init().then(function () {
              if (sdk.environment !== "crazygames" && sdk.environment !== "local") return off("environment " + sdk.environment);
              p.sdk = sdk;
              p.state = 2;
              var q = p.queue; p.queue = [];
              q.forEach(p.call);
              settle();
            }).catch(off);
          };
          document.head.appendChild(s);
        }
        return p;
      })();
    </script>
  </head>
  <body class="pol-body">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <a class="pol-back-btn" href="../">← 게임 허브</a>

    <div id="loader" class="pol-lobby fps-lobby">
      <div class="pol-lcard">
        <div class="pol-lphoto">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <rect class="lp-sky" width="120" height="70"/>
            <path class="lp-sun" d="M32 70 A28 28 0 0 1 88 70 Z"/>
            <rect class="lp-band" x="30" y="55" width="60" height="1.6"/>
            <rect class="lp-band" x="30" y="60" width="60" height="2.2"/>
            <rect class="lp-band" x="30" y="65" width="60" height="2.8"/>
            <rect class="lp-ground" y="70" width="120" height="50"/>
            <path class="lp-grid" d="M60 70 L-40 120 M60 70 L0 120 M60 70 L30 120 M60 70 L60 120 M60 70 L90 120 M60 70 L120 120 M60 70 L160 120 M0 73 H120 M0 77.5 H120 M0 84 H120 M0 93 H120 M0 105 H120"/>
            <line class="lp-horizon" x1="0" y1="70" x2="120" y2="70"/>
            <g class="lp-cross"><circle cx="60" cy="38" r="9"/><path d="M60 24 V32 M60 44 V52 M46 38 H54 M66 38 H74"/></g>
            <circle class="lp-dot" cx="60" cy="38" r="1.2"/>
          </svg>
        </div>
        <span class="pol-lnum">Unity WebGL</span>
        <span class="pol-ltag">time is health</span>
      </div>
      <div class="fps-col">
        <span class="pol-eyebrow">오버클럭 아레나 · 3D FPS</span>
        <h1 class="pol-ltitle" id="loader-title"></h1>
        <p class="sub fps-sub t-label is-mono">Mouse &amp; keyboard · Headphones on</p>
        <div class="fps-bar"><div class="fps-fill" id="fill"></div></div>
        <div class="fps-pct t-num" id="pct" role="status">0%</div>
      </div>
    </div>

    <div id="touch-start" class="pol-lobby fps-lobby hide">
      <div class="pol-lcard">
        <div class="pol-lphoto">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <rect class="lp-sky" width="120" height="70"/>
            <path class="lp-sun" d="M32 70 A28 28 0 0 1 88 70 Z"/>
            <rect class="lp-band" x="30" y="55" width="60" height="1.6"/>
            <rect class="lp-band" x="30" y="60" width="60" height="2.2"/>
            <rect class="lp-band" x="30" y="65" width="60" height="2.8"/>
            <rect class="lp-ground" y="70" width="120" height="50"/>
            <path class="lp-grid" d="M60 70 L-40 120 M60 70 L0 120 M60 70 L30 120 M60 70 L60 120 M60 70 L90 120 M60 70 L120 120 M60 70 L160 120 M0 73 H120 M0 77.5 H120 M0 84 H120 M0 93 H120 M0 105 H120"/>
            <line class="lp-horizon" x1="0" y1="70" x2="120" y2="70"/>
            <g class="lp-cross"><circle cx="60" cy="38" r="9"/><path d="M60 24 V32 M60 44 V52 M46 38 H54 M66 38 H74"/></g>
            <circle class="lp-dot" cx="60" cy="38" r="1.2"/>
          </svg>
        </div>
        <span class="pol-lnum">Unity WebGL</span>
        <span class="pol-ltag">time is health</span>
      </div>
      <div class="fps-col">
        <span class="pol-eyebrow">오버클럭 아레나 · 3D FPS</span>
        <h2 class="pol-ltitle" id="mobile-title"></h2>
        <p class="pol-ldesc" id="mobile-msg"></p>
        <button class="pol-lbtn" id="tap-start" type="button"></button>
      </div>
    </div>

    <script src="Build/WebGL.loader.js"></script>
    <script>
      var PRODUCT = "Overclock Arena";
      var loader = document.getElementById("loader");
      var mobile = document.getElementById("touch-start");
      // 터치 전용 기기(휴대폰·태블릿): 가상 컨트롤로 플레이. 마우스가 있는 기기는 바로 로딩
      var touchOnly = window.matchMedia && matchMedia("(pointer: coarse)").matches && !matchMedia("(pointer: fine)").matches;
      document.getElementById("loader-title").textContent = PRODUCT;
      document.getElementById("mobile-title").textContent = PRODUCT;
      document.getElementById("mobile-msg").textContent = "가로 화면을 권장해요 · Landscape recommended";
      document.getElementById("tap-start").textContent = "탭하여 시작 · Tap to start";
      if (touchOnly) document.querySelector("#loader .sub").textContent = "Touch controls · Headphones on";

      // 길게 누르기 메뉴·iOS 제스처 줌·페이지 스크롤 차단(캔버스 입력은 Unity가 받는다)
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
      document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || e.target !== document.getElementById("unity-canvas")) e.preventDefault(); }, { passive: false });

      function start() {
        mobile.classList.add("hide");
        loader.classList.remove("hide");
        window.FpsPortal.call("loadingStart"); // 포털: 로딩 구간 표시(포털 밖 no-op)
        window.FpsPortal.settled(boot);
      }

      function boot() {
        createUnityInstance(document.getElementById("unity-canvas"), {
          arguments: [],
          dataUrl: "Build/WebGL.data.unityweb",
          frameworkUrl: "Build/WebGL.framework.js.unityweb",
          codeUrl: "Build/WebGL.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "cityzen",
          productName: PRODUCT,
          productVersion: "1.0",
          autoSyncPersistentDataPath: true,
          // 모바일 GPU 부하: 렌더 해상도 상한 DPR 1.5(데스크톱은 기기 값 그대로)
          devicePixelRatio: touchOnly ? Math.min(window.devicePixelRatio || 1, 1.5) : undefined,
          // 포인터 락 거부(iframe 권한·헤드리스 등)는 치명 오류가 아니다 — 경고만 남기고 로더 alert를 막는다
          errorHandler: function (message) {
            if (/pointer ?lock/i.test(String(message))) { console.warn(message); return true; }
            return false;
          },
        }, function (progress) {
          document.getElementById("fill").style.width = (progress * 100) + "%";
          document.getElementById("pct").textContent = Math.round(progress * 100) + "%";
        }).then(function (unityInstance) {
          window.unityInstance = unityInstance;
          document.body.classList.add("is-playing"); // 게임 시작 — 허브 버튼·인화지 결 숨김
          // iPadOS 등 데스크톱 UA 터치 기기도 가상 컨트롤을 켜도록 힌트(GameManager.TouchHint → InputMap.HintTouch)
          if (touchOnly) { try { unityInstance.SendMessage("Game", "TouchHint"); } catch (e) { console.warn("[touch] hint", e); } }
          window.FpsPortal.call("loadingStop");
          loader.classList.add("hide");
          setTimeout(function () { loader.remove(); }, 600);
          document.getElementById("unity-canvas").focus();
        }).catch(function (message) {
          loader.classList.add("is-error");
          document.getElementById("pct").textContent = String(message);
        });
      }

      // 터치 기기: "탭하여 시작"(사용자 제스처 = 오디오 잠금 해제 + 전체 화면·가로 고정 시도, 포털 안에선 포털이 전체 화면을 맡는다)
      var started = false;
      function tapStart() {
        if (started) return;
        started = true;
        if (!window.FpsPortal.portal) {
          try {
            var el = document.documentElement, fs = el.requestFullscreen || el.webkitRequestFullscreen;
            var p = fs ? fs.call(el) : null;
            var lock = function () { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); } catch (e) {} };
            if (p && p.then) p.then(lock).catch(function () {}); else lock();
          } catch (e) { console.warn("[touch] fullscreen", e); }
        }
        start();
      }
      mobile.addEventListener("click", tapStart);
      if (touchOnly) { loader.classList.add("hide"); mobile.classList.remove("hide"); }
      else start();
    </script>
  </body>
</html>
